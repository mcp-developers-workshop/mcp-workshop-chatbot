<div class="chatbot-container">
  <div class="chatbot-header">
    <div class="header-left">
      <h2>Chatbot</h2>
      <div class="user-info" *ngIf="userInfo">
        <span class="user-name">{{ userInfo.name || userInfo.email }}</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="clear-btn" (click)="clearChat()" [disabled]="isLoading">
        Clear Chat
      </button>
      <button class="logout-btn" (click)="logout()">
        Logout
      </button>
    </div>
  </div>

  <div class="messages-container" #messagesContainer>
    <div
      *ngFor="let message of messages"
      class="message"
      [ngClass]="{'user-message': message.sender === 'user', 'bot-message': message.sender === 'bot'}">
      <div
        *ngIf="message.sender === 'bot'; else plainContent"
        class="message-content markdown-body"
        [innerHTML]="message.content | markdown">
      </div>
      <ng-template #plainContent>
        <div class="message-content">{{ message.content }}</div>
      </ng-template>
      <div class="message-timestamp">
        {{ message.timestamp | date:'short' }}
      </div>
    </div>

    <div *ngIf="isLoading" class="message bot-message">
      <div class="message-content loading">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <div class="error-message" *ngIf="error">
    {{ error }}
  </div>

  <div class="input-container">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keypress)="handleKeyPress($event)"
      placeholder="Type your message..."
      [disabled]="isLoading"
      class="message-input"
    />
    <button
      (click)="sendMessage()"
      [disabled]="!userInput.trim() || isLoading"
      class="send-btn">
      Send
    </button>
  </div>
</div>
